        function usePersistedState(key, defaultValue, uid) {
            const localKey = `${uid}_${key}`;
            const [state, setState] = useState(() => {
                try { const s = localStorage.getItem(localKey); return s ? JSON.parse(s) : defaultValue; } 
                catch (e) { return defaultValue; }
            });
            const [loaded, setLoaded] = useState(false);

            useEffect(() => {
                if(!uid) return;
                try { const s = localStorage.getItem(localKey); if(s) setState(JSON.parse(s)); else setState(defaultValue); } 
                catch { setState(defaultValue); }
            }, [uid, localKey]);

            useEffect(() => {
                if (!window.firebaseModules || !uid || uid === 'offline') { setLoaded(true); return; }
                const { db, appId, onSnapshot, doc } = window.firebaseModules;
                const ref = doc(db, 'artifacts', appId, 'users', uid, 'app_storage', key);
                const unsub = onSnapshot(ref, (s) => { 
                    if(s.exists() && s.data().content !== undefined) { 
                        setState(s.data().content); 
                        localStorage.setItem(localKey, JSON.stringify(s.data().content)); 
                    } 
                    setLoaded(true); 
                }, (err) => console.log('Err snap'));
                return () => unsub();
            }, [uid, key, localKey]);

            useEffect(() => {
                if(!loaded || !uid) return;
                localStorage.setItem(localKey, JSON.stringify(state));
                if(!window.firebaseModules || uid === 'offline') return;
                const { db, appId, doc, setDoc } = window.firebaseModules;
                const t = setTimeout(() => {
                    setDoc(doc(db, 'artifacts', appId, 'users', uid, 'app_storage', key), { content: state }, { merge: true }).catch(e => console.log('Err save'));
                }, 1500);
                return () => clearTimeout(t);
            }, [state, loaded, uid, localKey, key]);

            return [state, setState];
        }

        function usePublicSharedState(key, defaultValue) {
            const [state, setState] = useState(defaultValue);
            useEffect(() => {
                if(!window.firebaseModules) return;
                const { auth, db, appId, onSnapshot, doc } = window.firebaseModules;
                let unsub = null;
                const unsubAuth = auth.onAuthStateChanged((user) => {
                    if(unsub) { unsub(); unsub=null; }
                    if(user) {
                        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'global', key);
                        unsub = onSnapshot(ref, (s) => { if(s.exists() && s.data().content !== undefined) setState(s.data().content); }, (err) => console.log('Permisos'));
                    }
                });
                return () => { unsubAuth(); if(unsub) unsub(); };
            }, [key]);
            
            const update = (val) => {
                setState(val);
                if(!window.firebaseModules) return;
                const { auth, db, appId, doc, setDoc } = window.firebaseModules;
                if(auth.currentUser) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'global', key), { content: val }, { merge: true }).catch(e=>console.log('Err pub'));
            };
            return [state, update];
        }

                              ))}
                          </div>
                          <form onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); setShipping([...shipping, { id: Date.now(), clientName: f.get('clientName'), address: f.get('address'), tracking: f.get('tracking'), date: new Date().toISOString() }]); e.target.reset(); notify("Envío guardado"); }} className="bg-slate-50 p-6 rounded-3xl border border-slate-100 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                              <div className="md:col-span-1"><input name="clientName" required placeholder="Destinatario" className="w-full p-3 rounded-xl mt-1 text-xs font-bold" /></div>
                              <div className="md:col-span-1"><input name="address" required placeholder="Dirección" className="w-full p-3 rounded-xl mt-1 text-xs font-bold" /></div>
                              <div className="md:col-span-1"><input name="tracking" placeholder="Tracking" className="w-full p-3 rounded-xl mt-1 text-xs font-bold" /></div>
                              <div className="md:col-span-1"><button className="w-full py-3 bg-slate-900 text-white rounded-xl font-black uppercase">Despachar</button></div>
                          </form>
                      </div>
                  )}

                  {/* INVENTORY Y MACHINES */}
                  {(activeTab === 'inventory' || activeTab === 'machines') && (
                      <div className="bg-white p-6 rounded-[2.5rem] shadow-sm animate-in text-center">
                          <h2 className="text-3xl font-black uppercase mt-10">Módulo en Construcción</h2>
                          <p className="text-slate-500">Estamos optimizando esta sección para ti.</p>
                      </div>
                  )}

                  {/* CHECKLIST */}
                  {activeTab === 'checklist' && (
                      <div className="flex flex-col h-full animate-in">
                          <div className="flex justify-between items-end mb-6">
                              <h3 className="text-2xl font-black uppercase tracking-tighter">Taller</h3>
                              <form onSubmit={(e)=>saveEntity(e, setTasks, 'Tarea')} className="flex gap-2">
                                  <input name="name" placeholder="Nuevo Trabajo..." required className="p-3 rounded-xl bg-white border border-slate-200 shadow-sm text-xs font-bold w-64 outline-none"/>
                                  <button className="p-3 bg-dark text-white rounded-xl shadow-lg"><Icons.Plus className="w-4 h-4"/></button>
                              </form>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1 overflow-y-auto pb-6">
                              <div className="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                                  <h4 className="text-[10px] font-black uppercase text-amber-500 mb-4">En Proceso</h4>
                                  <div className="space-y-3">
                                      {tasks.filter(t => !t.completed).map(t => (
                                          <div key={t.id} className="p-4 bg-slate-50 rounded-2xl flex items-center justify-between">
                                              <span className="font-bold text-xs uppercase">{t.name}</span>
                                              <button onClick={() => setTasks(prev => prev.map(i => i.id === t.id ? { ...i, completed: true } : i))} className="p-2 text-emerald-500 bg-white rounded-lg shadow-sm"><Icons.CheckCircle2 className="w-4 h-4"/></button>
                                          </div>
                                      ))}
                                  </div>
                              </div>
                              <div className="bg-slate-100 p-6 rounded-[2.5rem] border border-slate-200 shadow-inner">
                                  <h4 className="text-[10px] font-black uppercase text-slate-400 mb-4">Finalizado</h4>
                                  <div className="space-y-3">
                                      {tasks.filter(t => t.completed).map(t => (
                                          <div key={t.id} className="p-4 bg-white/50 rounded-2xl flex items-center justify-between">
                                              <span className="font-bold text-xs uppercase text-slate-400 line-through">{t.name}</span>
                                              <button onClick={() => deleteItem(t.id, setTasks, 'Tarea')} className="p-2 text-slate-300"><Icons.Trash2 className="w-4 h-4"/></button>
                                          </div>
                                      ))}
                                  </div>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* CALCULATOR */}
                  {activeTab === 'calculator' && (
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in pb-10">
                          <div className="lg:col-span-2 space-y-6">
                              <div className="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                                  <h3 className="text-lg font-black uppercase mb-6 flex items-center gap-2"><Icons.Settings className="w-5 h-5"/> Configuración Base</h3>
                                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                      {['hourlyRate:Valor Hora','opExpenses:Gastos Fijos','profitMargin:% Ganancia'].map(f => {
                                          const [k, l] = f.split(':');
                                          return (
                                              <div key={k}><label className="text-[9px] font-bold uppercase text-slate-400 ml-1">{l}</label><input type="number" value={calc[k]} onChange={e => setCalc({...calc, [k]: parseFloat(e.target.value)||0})} className="w-full p-3 rounded-xl bg-slate-50 text-xs font-black text-slate-700 outline-none"/></div>
                                          )
                                      })}
                                  </div>
                              </div>
                          </div>
                          <div className="bg-dark p-8 rounded-[3rem] text-white shadow-2xl relative overflow-hidden flex flex-col justify-center text-center h-fit">
                              <h2 className="text-xs font-black uppercase tracking-[0.4em] text-indigo-400 mb-2 relative z-10">Precio Sugerido</h2>
                              <p className="text-6xl font-black tracking-tighter mb-2 relative z-10">${proCalcResult.final.toFixed(2)}</p>
                          </div>
                      </div>
                  )}
                  
                  {/* TIENDA DIGITAL */}
                  {activeTab === 'store' && (
                      <div className="space-y-6 animate-in pb-10">
                          <h3 className="text-2xl font-black uppercase tracking-tighter mb-6">Tienda Digital</h3>
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                              {digitalProducts.map(p => (
                                  <div key={p.id} className="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                                      <h4 className="font-black text-lg mb-2">{p.title}</h4>
                                      <p className="font-black text-xl text-emerald-600 mb-4">${p.price}</p>
                                      <a href={p.link} target="_blank" className="block w-full text-center py-2 bg-slate-900 text-white text-[9px] font-black uppercase rounded-xl">Pagar</a>
                                  </div>
                              ))}
                          </div>
                      </div>
                  )}

                  {/* CONTROL DE ACCESOS (ADMIN) */}
                  {activeTab === 'access_control' && isAdmin && (
                      <div className="bg-white p-6 md:p-8 rounded-[2.5rem] border border-slate-100 shadow-sm animate-in h-full flex flex-col">
                          <h3 className="text-2xl font-black uppercase tracking-tighter mb-6">Control de Accesos</h3>
                          <div className="flex-1 overflow-y-auto border border-slate-100 rounded-3xl p-2 bg-slate-50/50">
                              <table className="w-full text-left text-xs table-fixed">
                                  <thead className="text-[10px] uppercase font-black text-slate-400 border-b border-slate-100">
                                      <tr><th className="pb-4 pl-4 w-[30%]">Usuario / Email</th><th className="pb-4 w-[20%]">Plan</th><th className="pb-4 w-[20%] text-right pr-4">Estado</th></tr>
                                  </thead>
                                  <tbody className="text-slate-700 font-bold">
                                      {allUsers.map(u => (
                                          <tr key={u.uid} className="border-b border-slate-50 hover:bg-white">
                                              <td className="py-4 pl-4 truncate">{u.email}</td>
                                              <td className="py-4">
                                                  {u.email === ADMIN_EMAIL ? "Vitalicio" : <select value={u.subscriptionType || 'Mensual'} onChange={(e) => updateAccess(u.uid, { subscriptionType: e.target.value }, u.email)} className="p-2 rounded-xl bg-slate-100 outline-none w-[90%] text-xs font-black uppercase"><option value="Mensual">Mensual</option><option value="Anual">Anual</option></select>}
                                              </td>
                                              <td className="py-4 pr-4 text-right">
                                                  {u.email === ADMIN_EMAIL ? "Admin" : <select value={u.status || 'Activo'} onChange={(e) => updateAccess(u.uid, { status: e.target.value }, u.email)} className="p-2 rounded-xl outline-none w-full text-xs font-black uppercase bg-slate-100"><option value="Activo">Activo</option><option value="Prueba">Prueba</option><option value="Pendiente">Pendiente</option><option value="Bloqueado">Bloqueado</option></select>}
                                              </td>
                                          </tr>
                                      ))}
                                  </tbody>
                              </table>
                          </div>
                      </div>
                  )}

                  {/* MI SUSCRIPCIÓN */}
                  {activeTab === 'subscription' && currentUserData && (
                      <div className="bg-white p-6 md:p-8 rounded-[2.5rem] border border-slate-100 shadow-sm animate-in max-w-3xl mx-auto mt-10">
                          <h2 className="text-3xl font-black uppercase text-center mb-8">Mi Suscripción</h2>
                          <div className="bg-slate-900 rounded-[2rem] p-8 text-white text-center">
                              <p className="text-[10px] font-black uppercase text-indigo-400 mb-1">Estado Actual</p>
                              <p className="text-3xl font-black uppercase">{isTrialExpired ? 'Prueba Expirada' : currentUserData.status === 'Prueba' ? 'Prueba Gratis' : currentUserData.status}</p>
                              <p className="text-[10px] font-black uppercase text-indigo-400 mt-6 mb-1">Monto Mensual</p>
                              <p className="text-4xl font-black">${currentUserData.email === ADMIN_EMAIL ? '0' : currentUserData.monto}</p>
                          </div>
                      </div>
                  )}

                  {/* PLANES MC PRO */}
                  {activeTab === 'plans' && (
                      <div className="space-y-6 animate-in pb-10 text-center">
                          <h3 className="text-3xl font-black uppercase mt-6 mb-8">Elige tu Plan</h3>
                          <div className="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto items-center">
                              {[
                                  { id: 'Mensual', name: 'Plan Mensual', price: '490', duration: '/ mes' },
                                  { id: 'Trimestral', name: 'Plan Trimestral', price: '1.290', duration: '/ 3 meses' },
                                  { id: 'Anual', name: 'Plan Anual', price: '4.900', duration: '/ año', highlight: true }
                              ].map(plan => (
                                  <div key={plan.id} className={`p-8 rounded-[2.5rem] shadow-xl border ${plan.highlight ? 'bg-slate-900 text-white' : 'bg-white'}`}>
                                      <h4 className="text-xl font-black uppercase mb-4">{plan.name}</h4>
                                      <p className="text-5xl font-black mb-6">${plan.price}<span className="text-sm font-bold ml-1">{plan.duration}</span></p>
                                      <a href={`https://wa.me/59892617525?text=Hola!%20Quiero%20solicitar%20el%20${plan.name}`} target="_blank" className={`w-full block py-4 rounded-xl font-black uppercase ${plan.highlight ? 'bg-brand text-white' : 'bg-slate-100 text-slate-700'}`}>Lo Quiero</a>
                                  </div>
                              ))}
                          </div>
                      </div>
                  )}

                  {/* PERFIL */}
                  {activeTab === 'profile' && (
                      <div className="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl max-w-2xl mx-auto animate-in mt-10">
                          <h3 className="text-2xl font-black uppercase mb-8">Mis Datos</h3>
                          <div className="space-y-4">
                              <input value={userProfile.brand} onChange={(e) => setUserProfile({...userProfile, brand: e.target.value})} placeholder="Tu Marca" className="w-full p-3 rounded-xl bg-slate-50 text-xs font-bold outline-none border border-slate-100" />
                              <input value={userProfile.phone || ''} onChange={(e) => setUserProfile({...userProfile, phone: e.target.value})} placeholder="Teléfono" className="w-full p-3 rounded-xl bg-slate-50 text-xs font-bold outline-none border border-slate-100" />
                              <button onClick={() => notify("Datos guardados")} className="w-full py-3 bg-brand text-white rounded-xl font-black uppercase text-xs tracking-widest mt-4">Guardar</button>
                          </div>
                      </div>
                  )}

                </main>

                {/* MODAL RECORDATORIOS */}
                {showReminder && (
                    <div className="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-6">
                        <div className="bg-white max-w-sm w-full rounded-3xl p-10 text-center">
                            <h3 className="text-2xl font-black uppercase mb-6">Avisos de Hoy</h3>
                            <button onClick={() => setShowReminder(false)} className="w-full py-4 bg-slate-900 text-white rounded-xl font-black uppercase">Cerrar</button>
                        </div>
                    </div>
                )}
              </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [authLoaded, setAuthLoaded] = useState(false);
            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [notification, setNotification] = useState(null);
            const [showContactModal, setShowContactModal] = useState(false);
            
            const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(null), 2500); };

            useEffect(() => {
                let unsub = null;
                let isMounted = true;
                const checkFirebase = () => {
                    if (window.firebaseModules) {
                        unsub = window.firebaseModules.onAuthStateChanged(window.firebaseModules.auth, (u) => {
                            if (isMounted) { setUser(u); setAuthLoaded(true); }
                        });
                    } else {
                        if (isMounted) setTimeout(checkFirebase, 50);
                    }
                };
                checkFirebase();
                return () => { isMounted = false; if (unsub) unsub(); };
            }, []);

            const isRealUser = user && !user.isAnonymous;

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    await window.firebaseModules.signInWithEmailAndPassword(window.firebaseModules.auth, emailInput, passwordInput);
                    notify("Sesión iniciada.");
                } catch (err) {
                    setAuthError(err.code === 'auth/invalid-credential' ? "Usuario o contraseña incorrectos." : err.message);
                }
            };

            const handleLogout = () => window.firebaseModules.signOut(window.firebaseModules.auth);

            if (!authLoaded) return <div className="h-screen flex items-center justify-center font-black uppercase text-slate-300">Cargando...</div>;

            if (!isRealUser) return (
                <div className="flex h-screen items-center justify-center bg-slate-50 p-6">
                    <div className="w-full max-w-sm text-center bg-white p-8 rounded-3xl shadow-xl border border-slate-100 relative">
                        <div className="inline-block p-4 rounded-3xl bg-brand text-white shadow-xl mb-6 rotate-3"><Icons.Star className="w-8 h-8 fill-current" /></div>
                        <h1 className="text-3xl font-black text-slate-800 uppercase tracking-tighter mb-2">MC Pro</h1>
                        <p className="text-xs font-bold text-slate-400 uppercase tracking-[0.3em] mb-10">Acceso a Miembros</p>
                        
                        <form onSubmit={handleAuth} className="space-y-4">
                            <div className="bg-slate-50 p-3 rounded-2xl flex items-center border border-slate-100 relative">
                                <Icons.Mail className="w-5 h-5 text-slate-400 absolute left-4" />
                                <input type="email" required placeholder="Tu correo electrónico" className="bg-transparent outline-none w-full font-bold text-slate-700 text-center px-10" value={emailInput} onChange={e => setEmailInput(e.target.value)} />
                            </div>
                            <div className="bg-slate-50 p-3 rounded-2xl flex items-center border border-slate-100 relative">
                                <Icons.Key className="w-5 h-5 text-slate-400 absolute left-4" />
                                <input type="password" required placeholder="Tu contraseña" minLength="6" className="bg-transparent outline-none w-full font-bold text-slate-700 text-center px-10" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} />
                            </div>
                            {authError && <p className="text-xs font-bold text-red-500 bg-red-50 p-2 rounded-lg">{authError}</p>}
                            <button className="w-full py-4 bg-dark text-white rounded-2xl font-black uppercase tracking-widest hover:scale-[1.02] transition-all shadow-lg">Ingresar</button>

                            <div className="text-center pt-4 mt-4 border-t border-slate-100 space-y-3">
                                <button type="button" onClick={() => { setUser({ uid: 'offline', email: 'invitado@local', isAnonymous: true }); setAuthLoaded(true); }} className="w-full py-3 bg-slate-100 text-slate-700 rounded-xl font-bold uppercase text-xs tracking-widest hover:bg-slate-200 transition-colors shadow-sm">
                                    Entrar sin contraseña (Modo Local)
                                </button>
                                <button type="button" onClick={() => setShowContactModal(true)} className="text-[10px] font-bold uppercase tracking-widest text-slate-400 w-full mt-2">¿Problemas para ingresar?</button>
                            </div>
                        </form>
                    </div>

                    {showContactModal && (
                        <div className="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-6 text-center">
                            <div className="bg-white max-w-sm w-full rounded-3xl p-10 relative">
                                <h3 className="text-2xl font-black uppercase tracking-tighter mb-6">Soporte MC Pro</h3>
                                <a href="https://wa.me/59892617525" target="_blank" className="flex items-center justify-center gap-3 w-full py-4 bg-[#25D366] text-white rounded-xl font-black uppercase mb-4"><Icons.MessageCircle className="w-4 h-4" /> WhatsApp</a>
                                <button onClick={() => setShowContactModal(false)} className="w-full py-3 text-slate-400 font-bold uppercase text-xs">Cerrar</button>
                            </div>
                        </div>
                    )}
                    {notification && <div className="fixed top-6 right-6 bg-dark text-white px-6 py-3 rounded-xl font-bold text-xs uppercase z-50">{notification}</div>}
                </div>
            );

            return <Dashboard user={user} onLogout={handleLogout} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
